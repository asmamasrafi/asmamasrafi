<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#06251f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#00FFA3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#00D9FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFA3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 60px; letter-spacing: 6px; }
    .sub  { font-size: 17px; letter-spacing: 5px; fill: #8fb3c9; }
    .cmd  { font-size: 16px; fill: #00FFA3; }
    .tag  { font-size: 13px; fill: #6b8799; letter-spacing: 2px; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan { animation: sweep 5s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 150px 140px; }
    .ring { animation: ring 3.2s ease-out infinite; transform-origin: 150px 140px; }
    .fade1 { animation: rise 1s ease-out both; }
    .fade2 { animation: rise 1s ease-out .4s both; }
    .fade3 { animation: rise 1s ease-out .8s both; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1000px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes ring { 0% { transform: scale(0.8); opacity: .7; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- background -->
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="280" rx="18" fill="url(#glow)"/>

  <!-- scanning beam -->
  <rect class="scan" x="0" y="0" width="300" height="280" fill="url(#scan)"/>

  <!-- border + corner brackets -->
  <rect x="1" y="1" width="998" height="278" rx="17" stroke="#00D9FF" stroke-opacity="0.25"/>
  <path d="M24 52V24H52" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M976 52V24H948" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24 228V256H52" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M976 228V256H948" stroke="#00FFA3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- shield emblem -->
  <g>
    <circle class="ring" cx="150" cy="140" r="62" stroke="#00FFA3" stroke-width="2" fill="none"/>
    <g class="pulse">
      <path d="M150 82 L202 102 V144 C202 176 180 198 150 210 C120 198 98 176 98 144 V102 Z"
            fill="#0b1f2a" stroke="url(#neon)" stroke-width="4" stroke-linejoin="round"/>
      <!-- lock -->
      <rect x="133" y="140" width="34" height="28" rx="5" fill="url(#neon)"/>
      <path d="M139 140V130a11 11 0 0 1 22 0V140" stroke="url(#neon)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="150" cy="153" r="3.5" fill="#0b1220"/>
      <rect x="148.5" y="154" width="3" height="8" rx="1.5" fill="#0b1220"/>
    </g>
  </g>

  <!-- text -->
  <text class="mono tag fade1" x="270" y="72">// SECURITY ENGINEER IN THE MAKING</text>
  <text class="name fade2" x="268" y="136" fill="url(#neon)">ASSMA MASRAFI</text>
  <text class="mono sub fade3" x="272" y="170">CYBERSECURITY ENGINEERING STUDENT</text>

  <!-- terminal line -->
  <text class="mono cmd fade3" x="272" y="222">$ ./detect --audit --govern<tspan class="cursor"> █</tspan></text>
  <text class="mono tag" x="272" y="248">ENSA AGADIR · CLASS OF 2027 · OPEN TO PFE JAN 2027</text>

  <!-- decorative nodes -->
  <g fill="#00D9FF" fill-opacity="0.5">
    <circle cx="900" cy="70" r="3"/><circle cx="930" cy="110" r="2"/><circle cx="880" cy="150" r="2.5"/>
    <circle cx="935" cy="190" r="3"/><circle cx="905" cy="225" r="2"/>
  </g>
  <g stroke="#00D9FF" stroke-opacity="0.25">
    <path d="M900 70L930 110L880 150L935 190L905 225"/>
  </g>
</svg>
