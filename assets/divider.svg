    @keyframes glow { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  </style>
  <path class="dash" d="M0 8H1000" stroke="url(#line)" stroke-width="2"/>
  <rect class="dot" x="494" y="3" width="12" height="10" rx="2" transform="rotate(45 500 8)" fill="#00FFA3"/>
